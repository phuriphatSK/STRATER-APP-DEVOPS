# ============================================================================
#  Blackbox Exporter — ตรวจสอบบริการจากมุมมองของผู้ใช้ภายนอก
# ============================================================================
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_body_not_matches_regexp: []

  # ใช้ตรวจ /api/health โดยเจาะจงว่าต้องได้ status ok เท่านั้น
  http_api_health:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_body_not_matches_regexp:
        - '"database"\s*:\s*"up"'

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
