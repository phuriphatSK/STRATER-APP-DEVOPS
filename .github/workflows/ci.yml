# ============================================================================
#  CI — ตรวจคุณภาพโค้ด รันชุดทดสอบ สร้าง Image และทดสอบระบบจริงแบบครบชุด
#  ทำงานเมื่อมีการ push หรือเปิด Pull Request
# ============================================================================
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ------------------------------------------------ 1) คุณภาพโค้ดและชุดทดสอบ
  quality:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: ติดตั้ง dependency
        working-directory: backend
        run: npm ci

      - name: ตรวจคุณภาพโค้ด (ESLint)
        working-directory: backend
        run: npm run lint

      - name: รันชุดทดสอบอัตโนมัติ
        working-directory: backend
        run: npm test

      - name: ตรวจช่องโหว่ของ dependency
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

  # -------------------------------------------------- 2) ตรวจไวยากรณ์ Compose
  validate-compose:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ตรวจสอบไฟล์ docker-compose.yml
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci_dummy_password" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=ci_dummy_password" >> .env
          docker compose config --quiet
          docker compose --profile monitoring config --quiet

  # ------------------------------------------------------- 3) สร้าง Image
  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [quality, validate-compose]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: กำหนด tag ของ image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: เข้าสู่ระบบ Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (และ push เมื่อไม่ใช่ Pull Request)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ตรวจช่องโหว่ของ Image ด้วย Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        continue-on-error: true

      - name: ส่งผลการตรวจเข้าหน้า Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
        continue-on-error: true

  # --------------------------------- 4) ทดสอบระบบจริง (ยกทั้ง stack แล้วยิง API)
  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: [quality, validate-compose]
    steps:
      - uses: actions/checkout@v4

      - name: เตรียมไฟล์ตั้งค่า
        run: |
          # git อาจไม่บันทึกสิทธิ์รันของสคริปต์เมื่อ commit จาก Windows
          chmod +x ops/scripts/*.sh ops/backup/*.sh
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci_test_password" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=ci_test_password" >> .env
          echo "APP_PORT=8080" >> .env

      - name: ยกระบบขึ้น
        run: docker compose up -d --build

      - name: รอให้ทุกบริการพร้อมใช้งาน
        run: ./ops/scripts/wait-for-healthy.sh 180

      - name: ทดสอบการทำงานของระบบ
        run: ./ops/scripts/smoke-test.sh http://localhost:8080

      - name: ทดสอบการสำรองและกู้คืนข้อมูล
        run: ./ops/scripts/backup-drill.sh

      - name: แสดง log เมื่อทดสอบไม่ผ่าน
        if: failure()
        run: docker compose logs --tail=200

      - name: เก็บกวาด
        if: always()
        run: docker compose down -v
