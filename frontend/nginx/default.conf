# ============================================================================
#  Nginx — Web Server ของ Front-end + Reverse Proxy ไปยัง Back-end
# ============================================================================

# ใช้ DNS ภายในของ Docker และ resolve ตอน runtime (ผ่านตัวแปร)
# เพื่อให้ Nginx สตาร์ตได้แม้ container `backend` ยังไม่พร้อม
resolver 127.0.0.11 valid=10s ipv6=off;

# จำกัดอัตราการยิง API เพื่อกันการยิงถล่มจุดลงทะเบียน
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 1m;

    # ---- Security header พื้นฐาน ----
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    server_tokens off;

    # ---- บีบอัดข้อมูล ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- Health check ของตัว Web Server เอง ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Reverse Proxy: /api/* -> back-end ----
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ---- ไฟล์สแตติกของ Front-end ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ต้องไม่ถูก cache เพื่อให้ผู้ใช้ได้เวอร์ชันใหม่หลัง deploy
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
